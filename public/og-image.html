<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.bg-pattern {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0.1;
  background-image: 
    radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
    radial-gradient(circle at 80% 20%, white 1px, transparent 1px),
    radial-gradient(circle at 60% 80%, white 1px, transparent 1px);
  background-size: 60px 60px, 80px 80px, 100px 100px;
}
.content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 60px;
}
.logo {
  font-size: 72px;
  font-weight: 900;
  color: white;
  letter-spacing: -2px;
  margin-bottom: 8px;
}
.logo span {
  color: #a5b4fc;
}
.badge {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 8px 24px;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 40px;
  letter-spacing: 1px;
}
.tagline {
  font-size: 36px;
  color: #e0e7ff;
  font-weight: 600;
  margin-bottom: 40px;
  line-height: 1.3;
}
.features {
  display: flex;
  gap: 40px;
  justify-content: center;
}
.feature {
  text-align: center;
}
.feature-icon {
  font-size: 40px;
  margin-bottom: 12px;
}
.feature-text {
  color: #c7d2fe;
  font-size: 18px;
  font-weight: 500;
}
.url {
  position: absolute;
  bottom: 40px;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255,255,255,0.5);
  font-size: 20px;
  font-weight: 500;
}
</style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="content">
    <div class="logo"><span>GOGO</span> Invoice</div>
    <div class="badge">FREE FOR SA BUSINESSES</div>
    <div class="tagline">Professional Invoicing Made Simple</div>
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🇿🇦</div>
        <div class="feature-text">ZAR Currency</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📱</div>
        <div class="feature-text">WhatsApp Sharing</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-text">AI Powered</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🌍</div>
        <div class="feature-text">7 Languages</div>
      </div>
    </div>
  </div>
  <div class="url">invoice-app-beige-rho.vercel.app</div>
</body>
</html>
